name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
  engine:
    runs-on: ubuntu-latest
    env:
      AGARILAB_STORAGE_ROOT: ${{ github.workspace }}/.ci-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Require reviewed lockfile
        run: test -f uv.lock
      - run: python scripts/with_storage.py uv sync --frozen
      - run: python scripts/with_storage.py uv run --frozen python -m unittest discover -s tests/integration -v
